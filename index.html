<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calorie & Macro Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Calorie & Macro Tracker</h1>

    <!-- LOGIN -->
    <div class="login-box">
        <input id="username" placeholder="Enter username">
        <button id="loginBtn">Login</button>
    </div>

    <hr>

    <!-- FOOD INPUT -->
    <select id="foodSelect">
        <option value="">Select Food</option>
    </select>

    <input type="number" id="weightInput" placeholder="Enter weight (grams)">

    <div class="btn-group">
        <button id="calcBtn">Add Meal</button>
        <button id="clearBtn">Clear All</button>
    </div>

    <!-- MACROS -->
    <div class="macro-box">
        <h3 id="totalCalories">Total Calories: 0</h3>
        <h3 id="totalProtein">Total Protein: 0g</h3>
        <h3 id="totalCarbs">Total Carbs: 0g</h3>
        <h3 id="totalFat">Total Fat: 0g</h3>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Food</th>
                <th>Weight</th>
                <th>Calories</th>
                <th>Protein</th>
                <th>Carbs</th>
                <th>Fat</th>
            </tr>
        </thead>

        <tbody id="historyBody"></tbody>
    </table>

</div>

<script src="app.js"></script>

</body>
</html>
