<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Nobi's Calorie Deficit Tracker</h1>

        <select id="foodSelect">
            <option>Select Food</option>
        </select>

        <input type="number" id="weightInput" placeholder="Enter weight in grams">

        <button onclick="calculateCalories()">Calculate</button>

        <h2 id="result"></h2>

        <table>
            <thead>
                <tr>
                    <th>Food</th>
                    <th>Weight</th>
                    <th>Calories</th>
                </tr>
            </thead>

            <tbody id="historyBody"></tbody>
        </table>

        <h2 id="totalCalories">Total Calories: 0</h2>

        <button onclick="clearAll()" class="clear-btn">
            Clear Everything
        </button>
    </div>

    <script src="app.js"></script>

</body>
</html>
